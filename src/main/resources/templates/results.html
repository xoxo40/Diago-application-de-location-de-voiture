<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'cars')}">
<head><title>Voitures disponibles · DiaGo</title></head>
<body>
<main class="page">
    <div class="container">
        <div class="page-head row between" style="flex-wrap:wrap">
            <div>
                <h1>Voitures disponibles</h1>
                <p class="muted">
                    📍 <span th:text="${draft.pickupLocation}"></span> ·
                    <span th:text="${@fmt.date(draft.startDate)}"></span> → <span th:text="${@fmt.date(draft.endDate)}"></span>
                    (<span th:text="${days}">3</span> jour<span th:if="${days > 1}">s</span>)
                </p>
            </div>
            <a class="btn btn-ghost" th:href="@{/search}">Modifier la recherche</a>
        </div>

        <form class="filters auto-submit" th:action="@{/cars}" method="get">
            <div>
                <label class="lbl">Catégorie</label>
                <select class="input" name="category">
                    <option value="">Toutes</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.icon + ' ' + c.label}" th:selected="${c == fCategory}"></option>
                </select>
            </div>
            <div>
                <label class="lbl">Prix max / jour</label>
                <select class="input" name="maxPrice">
                    <option value="">Tous les prix</option>
                    <option value="60000" th:selected="${fMaxPrice == 60000}">≤ 60 000 Ar</option>
                    <option value="150000" th:selected="${fMaxPrice == 150000}">≤ 150 000 Ar</option>
                    <option value="350000" th:selected="${fMaxPrice == 350000}">≤ 350 000 Ar</option>
                </select>
            </div>
            <div>
                <label class="lbl">Type de voiture</label>
                <select class="input" name="type">
                    <option value="">Tous</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}" th:selected="${t == fType}"></option>
                </select>
            </div>
            <div>
                <label class="lbl">Chauffeur</label>
                <select class="input" name="mode">
                    <option value="WITHOUT_DRIVER" th:selected="${draft.mode.name() == 'WITHOUT_DRIVER'}">🔑 Sans chauffeur</option>
                    <option value="WITH_DRIVER" th:selected="${draft.mode.name() == 'WITH_DRIVER'}">🧑‍✈️ Avec chauffeur</option>
                </select>
            </div>
            <div></div>
            <a class="btn btn-ghost" th:href="@{/cars}">Réinitialiser</a>
        </form>

        <p class="muted" th:if="${draft.mode.name() == 'WITH_DRIVER'}">
            Avec chauffeur : supplément de <b th:text="${@fmt.price(driverPerDay)}"></b> / jour, déjà inclus dans le calcul de votre réservation.
        </p>

        <div class="card center" th:if="${#lists.isEmpty(cars)}">
            <h3>Aucune voiture ne correspond à ces filtres</h3>
            <a class="btn btn-primary" th:href="@{/cars}">Voir toutes les voitures</a>
        </div>

        <div class="grid-cars">
            <th:block th:each="v : ${cars}">
                <th:block th:replace="~{fragments/cards :: carCard(${v.car}, ${v.available})}"/>
            </th:block>
        </div>
    </div>
</main>
</body>
</html>
