<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'cars')}">
<head><title>Options de location · DiaGo</title></head>
<body>
<main class="page">
    <div class="container">
        <div th:replace="~{fragments/cards :: steps(2)}"></div>
        <div class="page-head">
            <h1>Options de location</h1>
            <p class="muted"><span th:text="${car.fullName}"></span> · <span th:text="${days}">3</span> jour<span th:if="${days > 1}">s</span></p>
        </div>

        <form id="optionsForm" th:action="@{/booking/options}" method="post"
              th:attr="data-rental=${price.rental},data-days=${days},data-driver=${driverPerDay}">
            <div class="two-col">
                <div>
                    <div class="mode-cards" style="margin-bottom:16px">
                        <label class="mode-card" th:if="${car.driverAvailable}">
                            <input type="radio" name="mode" value="WITH_DRIVER" th:checked="${draft.mode.name() == 'WITH_DRIVER'}">
                            <span class="box"><span class="i"><svg class="ic" viewBox="0 0 24 24"><path d="m16 11 2 2 4-4"/><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></svg></span><b>Avec chauffeur</b><span class="small muted">+ <span th:text="${@fmt.price(driverPerDay)}"></span>/j</span></span>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="mode" value="WITHOUT_DRIVER" th:checked="${draft.mode.name() == 'WITHOUT_DRIVER' or !car.driverAvailable}">
                            <span class="box"><span class="i"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/><path d="M12 14v8M10 12H2.5M14 12h7.5"/></svg></span><b>Sans chauffeur</b><span class="small muted">Vous conduisez</span></span>
                        </label>
                    </div>

                    <label class="opt" th:if="${car.insuranceAvailable}">
                        <span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
                        <span class="txt"><b>Assurance tous risques</b><span class="muted small">Couverture complète</span><span class="p">+ <span th:text="${@fmt.price(insurancePerDay)}"></span> / jour</span></span>
                        <span class="switch"><input type="checkbox" name="insurance" th:checked="${draft.insurance}" th:attr="data-price=${insurancePerDay},data-perday='true'"><i></i></span>
                    </label>
                    <label class="opt" th:if="${car.gpsAvailable}">
                        <span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></span>
                        <span class="txt"><b>GPS intégré</b><span class="muted small">Navigation hors ligne</span><span class="p">+ <span th:text="${@fmt.price(gpsPrice)}"></span></span></span>
                        <span class="switch"><input type="checkbox" name="gps" th:checked="${draft.gps}" th:attr="data-price=${gpsPrice},data-perday='false'"><i></i></span>
                    </label>
                    <label class="opt" th:if="${car.babySeatAvailable}">
                        <span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/></svg></span>
                        <span class="txt"><b>Siège bébé</b><span class="muted small">Homologué sécurité</span><span class="p">+ <span th:text="${@fmt.price(babyPrice)}"></span></span></span>
                        <span class="switch"><input type="checkbox" name="babySeat" th:checked="${draft.babySeat}" th:attr="data-price=${babyPrice},data-perday='false'"><i></i></span>
                    </label>
                    <label class="opt" th:if="${car.deliveryAvailable}">
                        <span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span>
                        <span class="txt"><b>Livraison de la voiture</b><span class="muted small">À votre adresse</span><span class="p">+ <span th:text="${@fmt.price(deliveryPrice)}"></span></span></span>
                        <span class="switch"><input type="checkbox" name="delivery" th:checked="${draft.delivery}" th:attr="data-price=${deliveryPrice},data-perday='false'"><i></i></span>
                    </label>
                    <label class="opt" th:if="${car.returnHomeAvailable}">
                        <span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
                        <span class="txt"><b>Retour à domicile</b><span class="muted small">Reprise à votre adresse</span><span class="p">+ <span th:text="${@fmt.price(returnPrice)}"></span></span></span>
                        <span class="switch"><input type="checkbox" name="returnHome" th:checked="${draft.returnHome}" th:attr="data-price=${returnPrice},data-perday='false'"><i></i></span>
                    </label>
                </div>

                <aside class="card sticky">
                    <img th:src="${car.imageUrl}" th:alt="${car.fullName}" style="border-radius:14px;margin-bottom:12px" onerror="this.style.display='none'">
                    <h3 th:text="${car.fullName}"></h3>
                    <p class="muted small">Location : <span th:text="${@fmt.price(price.rental)}"></span> (<span th:text="${days}"></span> j)</p>
                    <div class="row between" style="margin:14px 0">
                        <span class="muted">Total estimé</span>
                        <span class="price live-total" th:text="${@fmt.price(price.total)}">0 Ar</span>
                    </div>
                    <button class="btn btn-primary btn-block btn-lg" type="submit">Continuer</button>
                    <a class="btn btn-ghost btn-block" style="margin-top:10px" th:href="@{/cars/{id}(id=${car.id})}">← Retour</a>
                </aside>
            </div>
        </form>
    </div>
</main>
</body>
</html>
