<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'favorites')}">
<head><title>Mes favoris · DiaGo</title></head>
<body>
<main class="page">
    <div class="container">
        <div class="page-head"><h1>Mes favoris</h1><p class="muted">Vos voitures préférées, toujours à portée de clic.</p></div>
        <div class="card center" th:if="${#lists.isEmpty(cars)}">
            <h3>Aucun favori pour le moment</h3>
            <p class="muted">Cliquez sur ♥ sur une voiture pour la retrouver ici.</p>
            <a class="btn btn-primary" th:href="@{/cars}">Voir les voitures</a>
        </div>
        <div class="grid-cars">
            <th:block th:each="car : ${cars}">
                <th:block th:replace="~{fragments/cards :: carCard(${car}, ${car.available})}"/>
            </th:block>
        </div>
    </div>
</main>
</body>
</html>
