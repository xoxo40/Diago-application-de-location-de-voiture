<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin-layout :: layout(~{::title}, ~{::main}, 'cars')}">
<head><title>Voiture · DiaGo Admin</title></head>
<body>
<main>
    <a class="back" th:href="@{/admin/cars}"><svg class="i"><use href="#i-back"/></svg>Retour aux voitures</a>
    <div class="head"><h1 th:text="${carId == null} ? 'Ajouter une voiture' : 'Modifier la voiture'">Voiture</h1></div>

    <form class="form" th:object="${form}" method="post" enctype="multipart/form-data"
          th:action="${carId == null} ? @{/admin/cars} : @{/admin/cars/{id}(id=${carId})}">
        <div class="card">
            <h3>Informations</h3>
            <div class="grid-2">
                <div class="fg"><label class="lbl">Marque</label><input class="input" th:field="*{brand}"><div class="field-err" th:errors="*{brand}"></div></div>
                <div class="fg"><label class="lbl">Modèle</label><input class="input" th:field="*{model}"><div class="field-err" th:errors="*{model}"></div></div>
                <div class="fg"><label class="lbl">Catégorie</label>
                    <select class="input" th:field="*{category}"><option value="">Choisir</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option></select>
                    <div class="field-err" th:errors="*{category}"></div></div>
                <div class="fg"><label class="lbl">Type</label>
                    <select class="input" th:field="*{type}"><option value="">Choisir</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option></select>
                    <div class="field-err" th:errors="*{type}"></div></div>
                <div class="fg"><label class="lbl">Prix par jour (Ar)</label><input class="input" type="number" th:field="*{pricePerDay}"><div class="field-err" th:errors="*{pricePerDay}"></div></div>
                <div class="fg"><label class="lbl">Nombre de places</label><input class="input" type="number" th:field="*{seats}"><div class="field-err" th:errors="*{seats}"></div></div>
                <div class="fg"><label class="lbl">Transmission</label>
                    <select class="input" th:field="*{transmission}"><option value="">Choisir</option>
                        <option th:each="t : ${transmissions}" th:value="${t}" th:text="${t.label}"></option></select>
                    <div class="field-err" th:errors="*{transmission}"></div></div>
                <div class="fg"><label class="lbl">Carburant</label>
                    <select class="input" th:field="*{fuel}"><option value="">Choisir</option>
                        <option th:each="f : ${fuels}" th:value="${f}" th:text="${f.label}"></option></select>
                    <div class="field-err" th:errors="*{fuel}"></div></div>
                <div class="fg"><label class="lbl">Bagages</label><input class="input" type="number" th:field="*{luggage}"><div class="field-err" th:errors="*{luggage}"></div></div>
                <div class="fg"><label class="lbl">Équipements</label>
                    <label class="check"><input type="checkbox" th:field="*{ac}"> Climatisation</label>
                    <label class="check"><input type="checkbox" th:field="*{available}"> En service (réservable)</label></div>
            </div>
        </div>
        <div class="card">
            <h3>Options proposées aux clients pour cette voiture</h3>
            <div class="grid-2">
                <label class="check"><input type="checkbox" th:field="*{driverAvailable}"> Location avec chauffeur possible</label>
                <label class="check"><input type="checkbox" th:field="*{insuranceAvailable}"> Assurance tous risques</label>
                <label class="check"><input type="checkbox" th:field="*{gpsAvailable}"> GPS intégré</label>
                <label class="check"><input type="checkbox" th:field="*{babySeatAvailable}"> Siège bébé</label>
                <label class="check"><input type="checkbox" th:field="*{deliveryAvailable}"> Livraison de la voiture</label>
                <label class="check"><input type="checkbox" th:field="*{returnHomeAvailable}"> Retour à domicile</label>
            </div>
        </div>



        <div class="card">
            <h3>Photos et description</h3>
            <div class="fg">
                <label class="lbl">Photo principale (depuis votre ordinateur)</label>
                <img th:if="${form.imageUrl != null and !form.imageUrl.isBlank()}" th:src="@{${form.imageUrl}}" alt=""
                     style="width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block">
                <input class="input" type="file" name="photo" accept="image/*">
                <input type="hidden" th:field="*{imageUrl}">
                <div class="field-err" th:errors="*{imageUrl}"></div>
            </div>
            <div class="fg" style="margin-top:14px">
                <label class="lbl">Autres photos (tu peux en choisir plusieurs)</label>
                <input class="input" type="file" name="extraPhotos" accept="image/*" multiple>
                <textarea th:field="*{extraImages}" hidden></textarea>
            </div>
            <div class="fg" style="margin-top:14px"><label class="lbl">Description</label><textarea class="input" rows="3" th:field="*{description}"></textarea><div class="field-err" th:errors="*{description}"></div></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" type="submit"><svg class="i"><use href="#i-check"/></svg>Enregistrer</button>
            <a class="btn" th:href="@{/admin/cars}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
